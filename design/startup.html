<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小爱 · 启动片段</title>
<style>
:root{font-family:"Microsoft YaHei UI",sans-serif;color:#365344;background:#f7f8f3;--outline:#305543;--light:#d2dea3;--body:#afca92}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center}.stage{width:240px;height:200px}.stage svg{width:100%;height:100%;overflow:visible}.control{position:fixed;bottom:35px;left:20px;right:20px;display:grid;justify-items:center;gap:14px}h1{font-size:17px;font-weight:450;letter-spacing:2px;margin:0}.row{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}button,select{font:inherit;font-size:13px;border:1px solid #d6e0ce;border-radius:9px;background:#fffffa;color:inherit;padding:8px 14px}button{cursor:pointer}label,p{font-size:12px;color:#849083}p{margin:0;text-align:center;line-height:1.8}.grid{background-image:linear-gradient(45deg,#e6eadf 25%,transparent 25%),linear-gradient(-45deg,#e6eadf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6eadf 75%),linear-gradient(-45deg,transparent 75%,#e6eadf 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.halo{fill:var(--light);opacity:.2}.disc{fill:var(--body);opacity:.52}.dot{fill:var(--outline)}
.running .mark{animation:arrive .16s both,leave .22s .98s forwards}.running .halo,.running .disc{transform-origin:120px 100px;animation:unfold .6s cubic-bezier(.2,.7,.2,1) both}.running .top{animation:top .6s cubic-bezier(.2,.7,.2,1) both}.running .left{animation:left .6s cubic-bezier(.2,.7,.2,1) both}.running .right{animation:right .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes arrive{from{opacity:0}to{opacity:1}}@keyframes leave{to{opacity:0;transform:translateY(-6px)}}@keyframes unfold{from{transform:scale(0)}to{transform:scale(1)}}@keyframes top{from{transform:translate(-46px,-17px)}to{transform:translate(0,0)}}@keyframes left{from{transform:translate(49px,-31px)}to{transform:translate(0,0)}}@keyframes right{from{transform:translate(-2px,34px)}to{transform:translate(0,0)}}
.reduced .halo,.reduced .disc,.reduced .dot{animation:none!important}.reduced .mark{animation:arrive .1s both,leave .2s .7s forwards}@media(prefers-reduced-motion:reduce){.running .halo,.running .disc,.running .dot{animation:none}.running .mark{animation:arrive .1s both,leave .2s .7s forwards}}
</style>
<div class="stage running" aria-label="透明的三点标记短暂聚拢后淡去"><svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg"><g class="mark"><circle class="halo" cx="120" cy="100" r="43"/><circle class="disc" cx="120" cy="100" r="36"/><circle class="dot top" cx="120" cy="90" r="3.5"/><circle class="dot left" cx="110" cy="109" r="3.5"/><circle class="dot right" cx="130" cy="109" r="3.5"/></g></svg></div>
<div class="control"><h1>轻轻出现。</h1><div class="row"><button id="replay">重播</button><select id="color" aria-label="配色"><option value="forest">苔绿</option><option value="mist">雾蓝</option><option value="amber">暖砂</option></select><label><input id="reduce" type="checkbox">减少动态</label><label><input id="grid" type="checkbox">背景网格</label></div><p>设计预览 · 实际启动时位于屏幕中央，周围透明，点击可穿过。</p></div>
<script>
const stage=document.querySelector('.stage');function play(){stage.classList.remove('running');void stage.offsetWidth;stage.classList.add('running')}document.querySelector('#replay').onclick=play;document.querySelector('#reduce').onchange=e=>{stage.classList.toggle('reduced',e.target.checked);play()};document.querySelector('#grid').onchange=e=>document.body.classList.toggle('grid',e.target.checked);document.querySelector('#color').onchange=e=>{const colors={forest:['#305543','#d2dea3','#afca92'],mist:['#455a6c','#e1e9df','#c8d4df'],amber:['#74523c','#f3dfb0','#eac48b']}[e.target.value];['outline','light','body'].forEach((name,i)=>document.documentElement.style.setProperty('--'+name,colors[i]));play()};
</script></html>
