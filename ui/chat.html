<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https: http:; media-src blob: https: http:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'"><title>小爱 · 历史与媒体</title><link rel="stylesheet" href="/ui/chat.css"></head>
<body><header><div><h1>小爱</h1><p>历史与媒体</p></div><button id="recent">返回最近</button></header><main>
<details id="task-panel">
  <summary>持续任务<span id="task-count"></span></summary>
  <p id="task-fetch-error" role="status"></p>
  <p id="task-issue" role="status"></p>
  <div id="task-list"></div>
</details>
<nav><button id="older">更早记录</button><span id="range" role="status"></span><button id="newer">较新一页</button></nav><div id="issue" role="status"></div><section id="messages" aria-label="对话记录"></section><p id="empty" hidden>还没有对话。</p><footer>每页最多 24 条 · 媒体点击后播放 · 对话可选择并复制</footer></main>
<dialog id="preview"><div class="viewer-head"><span id="filename"></span><button id="close">关闭 Esc</button></div><div id="content"></div><p id="progress" role="status"></p></dialog><dialog id="draft-preview">
  <div class="viewer-head"><span id="draft-name"></span><button id="draft-close">关闭 Esc</button></div>
  <pre id="draft-text" tabindex="0"></pre>
</dialog>
<script src="/ui/chat.js"></script></body></html>
